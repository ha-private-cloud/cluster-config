name: deploy

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to apply (check its plan run first)"
        required: true
        type: string

jobs:
  plan:
    if: github.event_name == 'push'
    runs-on: [self-hosted]
    steps:
      - name: Sync repos
        run: sync-repos.sh cluster-cli cluster-config

      - name: tofu init
        run: cluster-cli tofu cluster-config --tag "${{ github.ref_name }}" init -input=false

      - name: tofu plan
        run: cluster-cli tofu cluster-config plan -input=false

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted]
    steps:
      - name: Sync repos
        run: sync-repos.sh cluster-cli cluster-config

      - name: tofu init
        run: cluster-cli tofu cluster-config --tag "${{ inputs.tag }}" init -input=false

      - name: tofu apply
        run: cluster-cli tofu cluster-config apply -auto-approve -input=false
